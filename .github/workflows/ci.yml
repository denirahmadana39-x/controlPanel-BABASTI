name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: babasti
          POSTGRES_PASSWORD: babasti
          POSTGRES_DB: babasti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U babasti"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://babasti:babasti@localhost:5432/babasti_test?schema=public"
      TEST_DATABASE_URL: "postgresql://babasti:babasti@localhost:5432/babasti_test?schema=public"
      REDIS_URL: ""
      SESSION_SECRET: "ci-session-secret-at-least-16-characters"
      SESSION_TTL: "604800"
      CLIENT_URL: "http://localhost:5173"
      DEPLOYMENT_PROVIDER: "mock"
      GOOGLE_CALLBACK_URL: "http://localhost:3000/api/auth/google/callback"
      GITHUB_CALLBACK_URL: "http://localhost:3000/api/github/callback"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Type-check (tsc -b)
        run: npm run typecheck

      - name: Build (tsc -b)
        run: npm run build

      - name: Run tests
        run: npm test
